<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Velvet Ceremony</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{
  --ink-bg:#ffffff; --ink-surface:#faf8f3; --ink-raised:#ffffff; --ink-line:#e6ded0;
  --ink-text:#26211a; --ink-muted:#8c8272; --ink-gold:#a17c3c; --ink-gold-strong:#7c5c28;
  --vel-bg:#fbf9f4; --vel-surface:#ffffff; --vel-raised:#ffffff; --vel-line:#e9e2d1;
  --vel-text:#26211a; --vel-muted:#82786a; --vel-gold:#93672c; --vel-gold-strong:#7a5522;
  --ok:#5f8f6a; --ok-bg:#20301e; --pending:#c17a3d; --pending-bg:#2c2013; --danger:#b2504a;
  --sage:#8a9a7e; --sage-strong:#57684c; --sage-bg:#f2f5ed; --sage-line:#d3ddc7;
  --r-s:10px; --r-m:16px; --r-l:26px; --r-xl:34px;
  --f-display:'Fraunces',Georgia,serif; --f-body:'Archivo',-apple-system,BlinkMacSystemFont,sans-serif; --f-mono:'IBM Plex Mono',ui-monospace,monospace;
  background:var(--ink-bg);
}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;background:var(--ink-bg);max-width:100vw;overflow-x:hidden}
body{font-family:var(--f-body);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
p{margin:0}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
::selection{background:#d9c8a3;color:#26211a}
#app{min-height:100vh;background:var(--bg);color:var(--text);max-width:100vw;overflow-x:hidden}
#app.mode-ink{--bg:var(--ink-bg);--surface:var(--ink-surface);--raised:var(--ink-raised);--line:var(--ink-line);--text:var(--ink-text);--muted:var(--ink-muted);--gold:var(--ink-gold);--gold-strong:var(--ink-gold-strong);--onGold:#fffaf0}
#app.mode-vellum{--bg:var(--vel-bg);--surface:var(--vel-surface);--raised:var(--vel-raised);--line:var(--vel-line);--text:var(--vel-text);--muted:var(--vel-muted);--gold:var(--vel-gold);--gold-strong:var(--vel-gold-strong);--onGold:#fff8ec}

.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold-strong);font-weight:600}
.muted{color:var(--muted)}
a{color:inherit}
input,textarea,select{background:var(--raised);border:1px solid var(--line);border-radius:var(--r-s);padding:11px 13px;width:100%}
input:focus-visible,textarea:focus-visible,button:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
textarea{resize:vertical}
.btn{border-radius:999px;padding:11px 20px;border:1px solid var(--line);background:var(--raised);font-weight:600;font-size:14px;transition:transform .15s ease,background .2s}
.btn:hover{transform:translateY(-1px)}
.btn.primary{background:var(--gold);color:var(--onGold);border-color:var(--gold)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.small{padding:7px 14px;font-size:12.5px}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:10px}
.tag{font-family:var(--f-mono);font-size:11px;letter-spacing:.04em;padding:3px 9px;border-radius:999px;border:1px solid var(--line)}
.tag.ok{color:var(--ok);border-color:var(--ok)}
.tag.pending{color:var(--pending);border-color:var(--pending)}
.tag.info{color:#5b7a99;border-color:#5b7a99}
.hairline{height:1px;background:var(--line);border:0;margin:0}
.code-chip{font-family:var(--f-mono);font-weight:600;letter-spacing:.1em;border:1px solid var(--gold);color:var(--gold-strong);padding:6px 14px;border-radius:999px;background:color-mix(in srgb,var(--gold) 10%,transparent)}
.code-chip.alt{border-color:var(--sage);color:var(--sage-strong);background:var(--sage-bg)}
.card-sage{background:var(--sage-bg);border-color:var(--sage-line)}
.person-row.intervenant{background:var(--raised);border-color:var(--sage-line);border-width:2px}
.card-sage .person-row.intervenant{background:#fff}
.view-enter{animation:enter .5s cubic-bezier(.2,.7,.3,1)}
@keyframes enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes qenter{from{opacity:0;transform:translateY(38px) scale(.98)}to{opacity:1;transform:none}}
.q-main>*{animation:qenter .8s cubic-bezier(.16,1,.3,1) both}
.q-main>*:nth-child(1){animation-delay:.03s}
.q-main>*:nth-child(2){animation-delay:.13s}
.q-main>*:nth-child(3){animation-delay:.26s}
.q-main>*:nth-child(4){animation-delay:.4s}
.btn{transition:transform .15s cubic-bezier(.34,1.56,.64,1),background .2s,box-shadow .2s,border-color .2s}
.btn:hover{transform:translateY(-2px) scale(1.02);box-shadow:0 10px 24px color-mix(in srgb,var(--gold) 25%,transparent)}
.btn:active{transform:scale(.94)}
.btn.primary:hover{box-shadow:0 12px 28px color-mix(in srgb,var(--gold) 45%,transparent)}
.q-main textarea{transition:border-color .25s,box-shadow .25s,transform .25s}
.q-main textarea:focus{border-color:var(--gold);box-shadow:0 0 0 6px color-mix(in srgb,var(--gold) 22%,transparent);transform:translateY(-2px)}
.autosave{transition:color .3s}
.autosave i{transition:transform .3s ease,background .3s ease;width:8px;height:8px}
.autosave.pulse{color:var(--gold-strong)}
.autosave.pulse i{animation:savepulse .9s cubic-bezier(.34,1.56,.64,1);background:var(--gold)}
@keyframes savepulse{0%{transform:scale(1);box-shadow:0 0 0 0 color-mix(in srgb,var(--gold) 50%,transparent)}35%{transform:scale(2.8);box-shadow:0 0 0 8px color-mix(in srgb,var(--gold) 0%,transparent)}100%{transform:scale(1)}}
.q-bar span{position:relative}
.q-bar span:after{content:"";position:absolute;right:-3px;top:50%;translate:0 -50%;width:8px;height:8px;border-radius:50%;background:var(--gold-strong);box-shadow:0 0 0 4px color-mix(in srgb,var(--gold) 30%,transparent)}
@media(prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}

/* ---------- Admin (ink world) ---------- */
.admin-shell{display:grid;grid-template-columns:252px 1fr;min-height:100vh}
.rail{background:var(--surface);border-right:1px solid var(--line);padding:28px 22px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.mark{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-style:italic;font-size:20px}
.mark svg{flex:none}
.rail nav{margin-top:38px;display:flex;flex-direction:column;gap:4px}
.rail nav a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;font-size:14px;font-weight:500;color:var(--muted);cursor:pointer}
.rail nav a:hover{color:var(--text)}
.rail nav a.active{background:var(--raised);color:var(--gold-strong)}
.rail .foot{margin-top:auto;font-size:12px;color:var(--muted);line-height:1.5}
.admin-main{padding:52px 60px 90px;max-width:1180px}
.header-row{align-items:flex-end}
.admin-header h1{font-size:clamp(32px,4vw,48px);font-weight:500;letter-spacing:-.02em}
.admin-header p{color:var(--muted);margin-top:8px;max-width:560px;line-height:1.55}
.wedding-row{display:grid;grid-template-columns:1.4fr 1fr auto;gap:18px;align-items:center;padding:20px 22px;border:1px solid var(--line);border-radius:var(--r-m);background:var(--surface);margin-top:12px;transition:border-color .2s}
.wedding-row:hover{border-color:var(--gold)}
.wedding-row h3{font-size:20px;font-weight:500}
.wedding-row .meta{color:var(--muted);font-size:13px;margin-top:4px}
.mini-bars{display:flex;gap:14px}
.dates-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:22px 0 -6px}
.date-pill{border:1px solid var(--line);border-radius:var(--r-s);padding:8px 14px;font-size:12.5px;display:flex;flex-direction:column;gap:2px;background:var(--surface)}
.date-pill .lbl{color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.05em}
.deadline-note{border:1px solid var(--vel-line);background:var(--vel-raised);border-radius:999px;padding:8px 16px;font-size:12.5px;color:var(--vel-muted);display:inline-flex;margin-top:14px}
.mini-bar{display:flex;flex-direction:column;gap:5px;min-width:86px}
.mini-bar .track{height:4px;background:var(--line);border-radius:99px;overflow:hidden}
.mini-bar .fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-strong))}
.mini-bar .lbl{font-size:11px;color:var(--muted)}
.tabs{display:flex;gap:2px;margin:30px 0 26px;border-bottom:1px solid var(--line);overflow-x:auto;touch-action:pan-x;-webkit-overflow-scrolling:touch;position:sticky;top:0;background:var(--bg);z-index:6}
.tabs button{background:none;border:none;padding:12px 18px;font-size:14px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;border-radius:0;white-space:nowrap;flex:none}
.tabs button.active{color:var(--gold-strong);border-color:var(--gold)}
.card{border:1px solid var(--line);border-radius:var(--r-m);background:var(--surface);padding:22px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.trame-grid{grid-template-columns:1.3fr 1fr;align-items:flex-start}
.export-doc{overflow-x:auto}
.people-section{margin-top:18px}
.person-wrap{position:relative;width:100%;max-width:190px;margin:16px auto 0}
.person-ring{position:relative;width:100%;height:0;padding-top:100%;border-radius:50%}
.person-row{position:absolute;inset:5px;border-radius:50%;background:var(--raised);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:5px;padding:14px;overflow:hidden}
.person-row.intervenant{cursor:grab}
.person-row .name{font-weight:700;font-size:19px;font-family:var(--f-display)}
.contact-row{display:flex;gap:6px}
.contact-ic{width:22px;height:22px;border-radius:50%;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--muted);flex:none}
.contact-ic:hover{color:var(--gold-strong);border-color:var(--gold)}
.person-edit{position:absolute;top:2px;right:2px;width:26px;height:26px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:12px;line-height:1;cursor:pointer}
.person-edit:hover{color:var(--gold-strong);border-color:var(--gold)}
.drag-handle{position:absolute;bottom:8px;left:50%;translate:-50% 0;font-size:13px;color:var(--sage-strong);cursor:grab;letter-spacing:.1em}
.person-rect{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 16px;border:1px solid var(--sage-line);border-radius:16px;background:var(--sage-bg);cursor:grab}
.person-rect .pr-info{min-width:110px}
.person-rect .sub{font-size:12px;color:var(--muted);margin-top:2px}
.drag-handle-rect{color:var(--sage-strong);font-size:15px;letter-spacing:.05em;flex:none;cursor:grab}
.person-edit-rect{margin-left:auto;width:26px;height:26px;border-radius:50%;border:1px solid var(--sage-line);background:#fff;color:var(--muted);font-size:12px;cursor:pointer;flex:none}
.person-edit-rect:hover{color:var(--gold-strong);border-color:var(--gold)}
.people-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;justify-items:center}
.palette-swatch{width:30px;height:30px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0;box-shadow:0 0 0 1px var(--line) inset}
.palette-swatch.active{border-color:var(--text)}
.progress-pill{position:relative;width:64px;height:64px}
.progress-pill svg{transform:rotate(-90deg)}
.progress-pill .num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--f-mono);font-size:13px;font-weight:600}
.overlay{position:fixed;inset:0;background:#0a0b12aa;backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:80;padding:20px}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:30px;width:min(440px,100%);box-shadow:0 40px 90px #0009}
.modal h3{font-size:22px;margin-bottom:18px;font-weight:500}
.field label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.06em}
.field{margin-bottom:14px}
.bank-theme{margin-top:26px}
.bank-theme > .head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.bank-theme h4{font-size:15px;font-weight:600;font-family:var(--f-body)}
.bank-item{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;padding:10px 4px;border-bottom:1px solid var(--line)}
.bank-item textarea{min-height:40px;background:transparent;border:1px solid transparent;padding:4px 6px}
.bank-item textarea:hover,.bank-item textarea:focus{background:var(--raised);border-color:var(--line)}
.bank-item.inactive textarea{color:var(--muted);text-decoration:line-through}
.switch{width:38px;height:22px;border-radius:99px;border:1px solid var(--line);background:var(--raised);position:relative;flex:none}
.switch i{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--muted);transition:.2s}
.switch.on{background:color-mix(in srgb,var(--gold) 25%,var(--raised));border-color:var(--gold)}
.switch.on i{left:18px;background:var(--gold-strong)}
.trame-row{display:grid;grid-template-columns:74px 1fr auto auto;gap:14px;align-items:center;padding:13px 4px;border-bottom:1px solid var(--line)}
.trame-row .time{font-family:var(--f-mono);font-size:13px;color:var(--gold-strong)}
.trame-row .lbl{font-weight:600;font-size:14.5px}
.trame-row .sub{font-size:12px;color:var(--muted)}
.export-doc{background:var(--vel-surface);color:var(--vel-text);border-radius:var(--r-m);padding:38px;font-family:var(--f-body)}
.export-doc h2{font-family:var(--f-display);font-weight:500;font-size:26px;color:var(--vel-text)}
.export-row{display:flex;flex-wrap:wrap;align-items:baseline;column-gap:14px;row-gap:2px;padding:11px 0;border-bottom:1px solid var(--vel-line);font-size:13.5px}
.export-row .t{flex:none}
.export-row .lbl{flex:2 1 180px;min-width:0}
.export-row .note{flex:1 1 140px;min-width:0}
.export-row .t{font-family:var(--f-mono);color:var(--vel-gold)}
.dictate-box{border:1px dashed var(--line);border-radius:var(--r-m);padding:18px;margin-top:14px;font-size:13px;color:var(--muted)}
.mic{width:40px;height:40px;border-radius:50%;border:1px solid var(--gold);background:transparent;display:flex;align-items:center;justify-content:center;flex:none}
.mic.live{background:var(--danger);border-color:var(--danger);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 10px #b2504a22}}

/* ---------- Guest (vellum world) ---------- */
.guest-shell{min-height:100vh;display:flex;flex-direction:column;position:relative;overflow:hidden}
.guest-shell:before{content:"";position:absolute;inset:0;z-index:0;background:radial-gradient(circle at 20% 0%,#fffdf7,transparent 55%),radial-gradient(circle at 85% 90%,#fbf0d8,transparent 50%)}
.constellation-veil{position:absolute;inset:0;z-index:0;opacity:.9;pointer-events:none}
.panel{position:relative;z-index:1;max-width:620px;margin:auto;padding:56px 20px;text-align:center}
.panel .spark{font-size:30px;color:var(--gold)}
.panel h1{font-size:clamp(32px,5.4vw,54px);font-weight:500;letter-spacing:-.02em;margin:14px 0 16px}
.lead{font-size:17px;line-height:1.65;color:var(--muted);max-width:480px;margin:0 auto}
.theme-toc{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:28px}
.theme-chip{border:1px solid var(--vel-line);background:var(--vel-raised);border-radius:999px;padding:9px 16px;font-size:13px;display:flex;align-items:center;gap:8px;transition:transform .15s ease,border-color .2s}
.theme-chip:hover{border-color:var(--vel-gold);transform:translateY(-2px)}
.theme-chip:active{transform:scale(.96)}
.theme-chip i{font-style:normal;font-family:var(--f-mono);font-size:11px;color:var(--vel-gold);background:color-mix(in srgb,var(--vel-gold) 12%,transparent);border-radius:99px;padding:1px 7px}
.code-input{font-family:var(--f-mono);font-size:24px;text-align:center;letter-spacing:.22em;max-width:300px;margin:26px auto 6px;padding:16px}
.quit-link{position:fixed;bottom:18px;left:18px;font-size:12px;color:var(--muted);z-index:5;background:none;border:none}
.q-stage{min-height:100vh;position:relative;padding:26px 20px 40px;display:flex;flex-direction:column}
.q-top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;font-size:13px;position:relative;z-index:2}
.q-top .r{text-align:right;font-family:var(--f-mono)}
.q-bar{height:3px;background:var(--vel-line);border-radius:99px;margin:18px 0 0;position:relative;z-index:2}
.q-bar,.q-bar span{overflow:visible}
.q-bar>span{display:block;border-radius:99px 0 0 99px}
.q-bar span{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-strong));transition:width .5s ease}
.q-main{max-width:680px;margin:7vh auto auto;text-align:center;position:relative;z-index:1}
.q-main h1{font-size:clamp(28px,4.4vw,46px);line-height:1.15}
.q-main textarea{font:20px/1.6 var(--f-display);margin:26px 0;min-height:180px;padding:20px;background:var(--vel-raised)}
.q-actions{display:flex;justify-content:space-between;gap:12px}
.autosave{position:fixed;bottom:20px;right:20px;font-size:11.5px;color:var(--muted);z-index:5;display:flex;gap:6px;align-items:center}
.autosave i{width:6px;height:6px;border-radius:50%;background:var(--ok)}
.bigpct{font-family:var(--f-display);font-size:76px}
.pending-list button{width:100%;text-align:left;margin-top:8px;font-size:13.5px}
.speaker-textarea{min-height:400px;font:18px/1.7 var(--f-display);padding:26px}

/* constellation view (printed on vellum) */
.const-wrap{background:var(--vel-surface);border-radius:var(--r-l);padding:34px;color:var(--vel-text)}
.const-wrap svg text{font-family:var(--f-body);fill:var(--vel-text)}
.const-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-top:22px}
.const-card{border:1px solid var(--vel-line);border-radius:var(--r-m);padding:16px;background:var(--vel-raised)}
.const-card .who{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--vel-gold);font-weight:700}
.const-card p{font-family:var(--f-display);font-style:italic;font-size:15.5px;line-height:1.5;margin-top:8px}
.const-words{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.const-words span{font-family:var(--f-display);color:var(--vel-gold);font-style:italic}

@media(max-width:880px){
 .admin-shell{grid-template-columns:1fr}
 .rail{position:relative;height:auto;flex-direction:row;align-items:center;padding:16px 18px}
 .rail nav{margin-top:0;flex-direction:row}
 .rail .foot{display:none}
 .admin-main{padding:28px 20px}
 .grid2{grid-template-columns:1fr}
 .wedding-row{grid-template-columns:1fr}
 .people-grid{gap:8px}
 .person-row{padding:12px;gap:8px}
 .header-row{flex-direction:column;align-items:flex-start!important;gap:14px}
}
</style>

<div id="app"></div>

<script>

function toggleBank(i){const q=db.bank.find(q=>q.i===i);q.active=!q.active;save();render()}
function editBank(i,v){const q=db.bank.find(q=>q.i===i);q.text=v.trim()||q.text;save()}
function deleteBankQuestion(i){
 const q=db.bank.find(q=>q.i===i);
 if(!confirm(`Supprimer définitivement cette question ?\n\n« ${q.text} »\n\nLes réponses déjà données par des mariés à cette question ne seront plus affichées nulle part.`))return;
 db.bank=db.bank.filter(q=>q.i!==i);save();render()
}
function createBankQuestion(){

 db.bank.push({i,text,active:true,theme});
 save();st.modal=null;render()
}

 const w=wedding();
 const intervenants=w.people.filter(p=>p.role==='intervenant');
 const others=w.people.filter(p=>p.role!=='intervenant');

 <div class="const-wrap"><div class="eyebrow" style="color:var(--vel-gold)">Constellation du couple</div><h2 style="margin-top:8px">${esc(w.names)}</h2>

function buildConstellationData(w){
 const maries=w.people.filter(p=>p.role==='marie').slice(0,2);
 const stars=[];
 Object.keys(THEMES).forEach((theme,ti)=>{
  maries.forEach((p,pi)=>{
   const q=activeBank().find(q=>q.theme===theme && String((p.answers||{})[q.i]||'').trim());
   if(q)stars.push({theme,ti,pi,person:p.name,text:(p.answers[q.i]||'').trim(),qtext:q.text})
  })
 });
 const allText=maries.map(p=>Object.values(p.answers||{}).join(' ')).join(' ').toLowerCase();
 const freq={};
 allText.split(/[^a-zàâäéèêëïîôöùûüçœ’']+/i).forEach(w=>{w=w.replace(/’/g,"'");if(w.length>3&&!STOPWORDS.has(w))freq[w]=(freq[w]||0)+1});
 const words=Object.entries(freq).sort((a,b)=>b[1]-a[1]).slice(0,10).map(x=>x[0]);
 return {stars,words,maries};
}
function drawConstellation(){
 const w=wedding();const svg=document.getElementById('constSvg');if(!svg)return;
 const {stars,words}=buildConstellationData(w);
 const themeKeys=Object.keys(THEMES);
 const n=themeKeys.length;
 const margin=80;
 const colX=themeKeys.map((_,i)=>n>1?margin+(720-2*margin)*(i/(n-1)):360);
 const rowY=[150,255];
 stars.forEach(s=>{s.x=colX[s.ti];s.y=rowY[s.pi]});
 let paths='';
 for(let ti=0;ti<n-1;ti++){
  const a=stars.filter(s=>s.ti===ti); const b=stars.filter(s=>s.ti===ti+1);
  if(a.length&&b.length)paths+=`<line x1="${a[0].x}" y1="${a[0].y}" x2="${b[0].x}" y2="${b[0].y}" stroke="var(--vel-gold)" stroke-width="1" opacity=".28"/>`;
 }
 Object.values(THEMES).forEach((t,ti)=>{
  const pair=stars.filter(s=>s.ti===ti);
  if(pair.length===2)paths+=`<line x1="${pair[0].x}" y1="${pair[0].y}" x2="${pair[1].x}" y2="${pair[1].y}" stroke="var(--vel-gold)" stroke-width="1" stroke-dasharray="3 4" opacity=".5"/>`;
 });
 const dots=stars.map(s=>{
  const anchor=s.x>360?'end':'start'; const dx=s.x>360?-12:12;
  return `<circle cx="${s.x}" cy="${s.y}" r="9" fill="var(--vel-gold)" opacity=".14">${reduceMotion()?'':'<animate attributeName="r" values="9;13;9" dur="4s" repeatCount="indefinite"/>'}</circle>
   <circle cx="${s.x}" cy="${s.y}" r="4" fill="var(--vel-gold)"/>
   <text x="${s.x+dx}" y="${s.y-10}" font-size="11" text-anchor="${anchor}" font-weight="600">${esc(s.person)}</text>
   <text x="${s.x+dx}" y="${s.y+4}" font-size="10" text-anchor="${anchor}" opacity=".7">${THEMES[s.theme].short||THEMES[s.theme].label}</text>`
 }).join('');
 svg.innerHTML=`<line x1="60" y1="330" x2="680" y2="330" stroke="var(--vel-line)" opacity=".5"/>${paths}${dots}`;
 document.getElementById('constCards').innerHTML=stars.map(s=>`<div class="const-card"><div class="who">${esc(s.person)} · ${THEMES[s.theme].label}</div><p>“${esc(s.text.length>140?s.text.slice(0,140)+'…':s.text)}”</p></div>`).join('');
 document.getElementById('constWords').innerHTML=words.map(w=>`<span>${esc(w)}</span>`).join(' · ');
}

async function generatePreambule(){
 const w=wedding();
 const btn=$('#genPreambuleBtn'),status=$('#preambuleStatus'),box=$('#preambuleBox');
 const sample=(typeof claude!=='undefined'&&claude.use)?await claude.use('sample').catch(()=>null):null;
 if(!sample){status.textContent="Fonction IA indisponible dans cet aperçu.";return}
 const maries=w.people.filter(p=>p.role==='marie');
 const snippets=[];
 maries.forEach(p=>{
  activeBank().forEach(q=>{
   if((q.theme==='rencontre'||q.theme==='couple')&&(p.answers||{})[q.i]){
    snippets.push(`${p.name} — ${q.text} → ${p.answers[q.i]}`)
   }
  })
 });
 const prompt=`Tu écris pour Sève, officiante de cérémonie laïque de mariage. Rédige le préambule d'ouverture qu'elle prononcera à voix haute devant les invités pour le mariage de ${w.names}, le ${fmtDate(w.date)} à ${w.place}.
Style : chaleureux, personnel, élégant, jamais ampoulé ni cliché. Elle s'adresse directement aux mariés et aux invités, à la première personne. Longueur : 150 à 250 mots. Pas de didascalies, pas de crochets, juste le texte à dire.
Voici des éléments réels racontés par les mariés à utiliser pour personnaliser le texte (n'invente rien d'autre) :
${snippets.slice(0,8).join('\n')||'(Peu de réponses collectées pour l’instant — reste plus général mais toujours chaleureux.)'}`;
 btn.disabled=true;status.textContent='Génération en cours…';
 try{
  const res=await sample(prompt,{onText:({text})=>{box.value=text;savePreambule(text)}});
  box.value=res.text;savePreambule(res.text);
  status.textContent='Généré — relisez avant de vous en servir.';
 }catch(e){
  status.textContent=e?.code==='not_granted'?'Autorisation refusée.':'Une erreur est survenue, réessayez.';
 }
 btn.disabled=false;
}
let recog=null,recogOn=false;
function toggleDictation(){
 const btn=$('#micBtn'),lbl=$('#micLabel');
 if(recogOn){recogOn=false;btn.classList.remove('live');lbl.textContent='Dicter au micro';try{recog&&recog.stop()}catch(e){}return}
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR){lbl.textContent='Micro non disponible dans cet aperçu';return}
 try{
  recog=new SR();recog.lang='fr-FR';recog.continuous=true;recog.interimResults=false;
  recog.onresult=(e)=>{const ta=document.querySelector('.card textarea');let t='';for(let i=e.resultIndex;i<e.results.length;i++)t+=e.results[i][0].transcript+' ';ta.value=(ta.value+' '+t).trim();saveNotes(ta.value)};
  recog.onerror=()=>{lbl.textContent='Micro indisponible ici';btn.classList.remove('live');recogOn=false};
  recog.onend=()=>{if(recogOn){lbl.textContent='Micro indisponible ici';btn.classList.remove('live');recogOn=false}};
  recog.start();recogOn=true;btn.classList.add('live');lbl.textContent='Écoute en cours…';
 }catch(e){lbl.textContent='Micro non disponible dans cet aperçu'}
}

function autosaveAnswer(v){
 const p=person();p.answers=p.answers||{};
 clearTimeout(window._at);window._at=setTimeout(()=>{
  if(v.trim()){p.answers[st.qIndex]=v;p.skipped=(p.skipped||[]).filter(x=>x!==st.qIndex)}else{delete p.answers[st.qIndex]}
  save();
  const bar=document.querySelector('.q-bar span');if(bar)bar.style.width=pct(p)+'%';
  const top=document.getElementById('pctText');if(top)top.textContent=pct(p)+'%';
  const box=document.getElementById('autosaveBox'),txt=document.getElementById('autosaveText');
  if(box){box.classList.remove('pulse');void box.offsetWidth;box.classList.add('pulse')}
  if(txt){txt.textContent='Enregistré ✓';clearTimeout(window._atxt);window._atxt=setTimeout(()=>{txt.textContent='Sauvegarde automatique'},1400)}
 },350)

function nextQuestion(){
 const v=$('#ans').value.trim();const p=person();p.answers=p.answers||{};
 if(v){p.answers[st.qIndex]=v;p.skipped=(p.skipped||[]).filter(x=>x!==st.qIndex)}
 save();chimeNext();advance()
}
function goBack(){
 const ta=$('#ans');
 if(ta){const v=ta.value.trim();const p=person();p.answers=p.answers||{};if(v){p.answers[st.qIndex]=v;p.skipped=(p.skipped||[]).filter(x=>x!==st.qIndex)}save()}
 chimeSoft();
 const q=db.bank.find(q=>q.i===st.qIndex);
 const themeAll=activeBank().filter(x=>x.theme===q.theme).map(x=>x.i);
 const pos=themeAll.indexOf(st.qIndex);
 if(pos>0){st.qIndex=themeAll[pos-1];render();return}
 const themeKeys=Object.keys(THEMES);
 const ti=themeKeys.indexOf(q.theme);
 for(let i=ti-1;i>=0;i--){
  const items=activeBank().filter(x=>x.theme===themeKeys[i]).map(x=>x.i);
  if(items.length){st.qIndex=items[items.length-1];render();return}
 }
}
function advance(){
 const p=person();
 const curTheme=db.bank.find(q=>q.i===st.qIndex).theme;
 const themeAll=activeBank().filter(x=>x.theme===curTheme).map(x=>x.i);
 const themeCandidates=st.pendingOnly?pendingList(p).filter(x=>x.theme===curTheme).map(x=>x.i):themeAll;
 const pos=themeCandidates.indexOf(st.qIndex);
 if(pos>=0&&pos<themeCandidates.length-1){st.qIndex=themeCandidates[pos+1];render();return}
 if(!st.pendingOnly){const ap=themeAll.indexOf(st.qIndex);if(ap<themeAll.length-1){st.qIndex=themeAll[ap+1];render();return}}
 const themeKeys=Object.keys(THEMES);
 const startIdx=themeKeys.indexOf(curTheme);
 for(let i=1;i<=themeKeys.length;i++){
  const k=themeKeys[(startIdx+i)%themeKeys.length];
  const pend=pendingList(p).filter(x=>x.theme===k);
  if(pend.length){st.qIndex=pend[0].i;render();return}
 }
 st.view='summary';render()
}

function chime(freqs,dur,vol){
 if(!soundOn)return;
 try{
  actx=actx||new (window.AudioContext||window.webkitAudioContext)();
  const t0=actx.currentTime;
  freqs.forEach((f,i)=>{
   const o=actx.createOscillator(),g=actx.createGain();
   o.type='sine';o.frequency.value=f;
   const start=t0+i*0.07;
   g.gain.setValueAtTime(0,start);
   g.gain.linearRampToValueAtTime(vol,start+0.02);
   g.gain.exponentialRampToValueAtTime(0.0001,start+dur);
   o.connect(g);g.connect(actx.destination);
   o.start(start);o.stop(start+dur+0.02);
  });
 }catch(e){}
}

function drawVeil(){
 const svg=document.getElementById('veilSvg');if(!svg)return;
 const still=reduceMotion();
 let s='';const rnd=(seed)=>{const x=Math.sin(seed*999)*10000;return x-Math.floor(x)};
 const sparklePath='M0 -6 C0.8 -2 2 -0.8 6 0 C2 0.8 0.8 2 0 6 C-0.8 2 -2 0.8 -6 0 C-2 -0.8 -0.8 -2 0 -6 Z';
 for(let i=0;i<16;i++){const x=rnd(i)*900,y=rnd(i+50)*700,scale=1.3+rnd(i+100)*1.8,base=.55+rnd(i+150)*.15,peak=.95,dur=2.6+rnd(i+400)*3,begin=rnd(i+500)*4;
  s+=`<g transform="translate(${x},${y}) scale(${scale.toFixed(2)})"><path d="${sparklePath}" fill="#8a6a2f" opacity="${base}">${still?'':`<animate attributeName="opacity" values="${base};${peak};${base}" dur="${dur}s" begin="${begin}s" repeatCount="indefinite"/>`}</path></g>`
 }
 for(let i=0;i<40;i++){const x=rnd(i+700)*900,y=rnd(i+750)*700,r=.6+rnd(i+800)*.7;
  s+=`<circle cx="${x}" cy="${y}" r="${r}" fill="#c9b48a" opacity="${0.06+rnd(i+900)*0.08}"/>`
 }
 for(let i=0;i<5;i++){const x1=rnd(i+300)*900,y1=rnd(i+310)*700,x2=x1+80+rnd(i+320)*160,y2=y1+40+rnd(i+330)*120;
  s+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="var(--vel-gold)" stroke-width=".6" opacity=".12"/>`
 }
 svg.innerHTML=s;
}
