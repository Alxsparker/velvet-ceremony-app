name: Keep Supabase Project Alive

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase auth health endpoint
        env:
          SUPABASE_URL: https://pmgqpdjzptryegjfhsry.supabase.co
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -e
          echo "Pinging $SUPABASE_URL ..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/auth/v1/health")
          echo "HTTP status: $STATUS"
          if [ "$STATUS" -ge 500 ] || [ "$STATUS" = "000" ]; then
            echo "Unhealthy response, failing job."
            exit 1
          fi
